                    }
                ];
                save();
            }

            function getFiltered() {
                let result = [...assets];

                const q = searchInput.value.toLowerCase().trim();
                if (q) {
                    result = result.filter(item =>
                        item.judul.toLowerCase().includes(q) ||
                        (item.pembuat && item.pembuat.toLowerCase().includes(q)) ||
                        (item.kategori && item.kategori.toLowerCase().includes(q)) ||
                        (item.tag && item.tag.some(t => t.toLowerCase().includes(q))) ||
                        (item.software && item.software.toLowerCase().includes(q))
                    );
                }

                if (currentView === 'trending') {
                    result.sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
                } else if (currentView === 'favorites') {
                    result = result.filter(item => item.favorite);
                } else if (currentView === 'free') {
                    result = result.filter(item => item.license === 'free');
                } else if (currentView === 'pro') {
                    result = result.filter(item => item.license === 'pro');
                }

                if (currentChip !== 'all') {
                    result = result.filter(item => {
                        if (currentChip === 'after-effects') return item.software === 'After Effects';
                        if (currentChip === 'premiere') return item.software === 'Premiere Pro';
                        if (currentChip === 'capcut') return item.software === 'CapCut';
                        if (currentChip === 'alight') return item.software === 'Alight Motion';
                        if (currentChip === 'vn') return item.software === 'VN Video Editor';
                        if (currentChip === 'free') return item.license === 'free';
                        if (currentChip === 'pro') return item.license === 'pro';
                        if (currentChip === 'velocity') return item.tag && item.tag.some(t => t.toLowerCase() === 'velocity');
                        if (currentChip === 'transition') return item.kategori === 'Transition';
                        return true;
                    });
                }

                return result;
            }

            // A default, unfiltered browse — this is when the sectioned homepage shows.
            // The moment the person searches or narrows a filter, we drop to a flat result grid.
            function isHomeState() {
                return currentView === 'all' && currentChip === 'all' && !searchInput.value.trim();
            }

            function heatScore(item) {
                // "Trending" = recent engagement, not just raw downloads
                return (item.downloads || 0) * 1 + (item.likes || 0) * 3 + (item.views || 0) * 0.1;
            }

            function aggregateCreators() {
                const map = new Map();
                assets.forEach(item => {
                    const name = item.pembuat || 'Anonim';
                    if (!map.has(name)) {
                        map.set(name, { name, count: 0, downloads: 0, softwareCounts: {} });
                    }
                    const c = map.get(name);
                    c.count += 1;
                    c.downloads += (item.downloads || 0);
                    if (item.software) c.softwareCounts[item.software] = (c.softwareCounts[item.software] || 0) + 1;
                });
                return Array.from(map.values()).map(c => {
                    let topSoftware = '';
                    let max = 0;
                    Object.entries(c.softwareCounts).forEach(([sw, n]) => { if (n > max) { max = n; topSoftware = sw; } });
                    return { ...c, topSoftware };
                }).sort((a, b) => b.downloads - a.downloads);
            }

            // ---------- card templates ----------
            function assetCardHTML(item, opts) {
                opts = opts || {};
                const youtubeId = item.linkYoutube ? getYoutubeId(item.linkYoutube) : null;
                const embedUrl = youtubeId ? embedYoutube(youtubeId) : null;
                const thumb = item.thumbnail || '';
                const tags = (item.tag || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
                const isFree = item.license === 'free';
                const isPro = item.license === 'pro';
                const badgeClass = isFree ? 'free' : 'pro';
                const badgeText = isFree ? 'Gratis' : 'Pro';

                return `
                    <div class="asset-card" data-id="${item.id}">
                        <div class="card-media-wrap">
                            ${opts.newRibbon ? `<span class="ribbon-new">Baru</span>` : ''}
                            ${thumb ? `<img class="thumb" src="${escapeHtml(thumb)}" alt="${escapeHtml(item.judul)}" loading="lazy" onerror="this.style.display='none'">` :
                                `<div class="thumb-placeholder"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="8" y1="2" x2="8" y2="22"/><line x1="16" y1="2" x2="16" y2="22"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="2" y1="16" x2="22" y2="16"/></svg></div>`
                            }
                        </div>
                        <div class="body">
                            <div class="asset-top">
                                <div class="asset-title">${escapeHtml(item.judul)}</div>
                                <div class="asset-badges">
                                    ${isFree || isPro ? `<span class="badge ${badgeClass}">${badgeText}</span>` : ''}
                                </div>
                            </div>
                            <div class="asset-creator">
                                <div class="avatar">${getInitials(item.pembuat)}</div>
                                <span class="name">${escapeHtml(item.pembuat || 'Anonim')}</span>
                                <span class="verified">
                                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                </span>
                            </div>
                            <div class="asset-stats">
                                <span>
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    ${formatNumber(item.downloads || 0)}
                                </span>
                                <span>
                                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    ${formatNumber(item.views || 0)}
                                </span>
                                <span>
                                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    ${formatNumber(item.likes || 0)}
                                </span>
                                ${item.software ? `<span>${escapeHtml(item.software)}</span>` : ''}
                            </div>
                            ${tags ? `<div class="asset-tags">${tags}</div>` : ''}
                            ${item.deskripsi ? `<div class="desc" style="font-size:0.8rem;color:var(--text-secondary);margin:0.3rem 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${escapeHtml(item.deskripsi)}</div>` : ''}
                            ${embedUrl ? `<div style="border-radius:var(--radius-xs);overflow:hidden;aspect-ratio:16/9;background:#000;margin:0.4rem 0;"><iframe src="${embedUrl}" style="width:100%;height:100%;border:none;" allowfullscreen loading="lazy"></iframe></div>` : ''}
                            <div class="asset-actions">
                                <button class="asset-like ${item.favorite ? 'active' : ''}" data-like="${item.id}">
                                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    ${item.likes || 0}
                                </button>
                                <button class="asset-save" data-save="${item.id}">
                                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    Simpan
                                </button>
                                <button class="asset-download" data-download="${item.id}">
                                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                    Download
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            function trendCardHTML(item, rank) {
                const thumb = item.thumbnail || '';
                return `
                    <div class="trend-card" data-id="${item.id}">
                        <span class="rank"><span class="dot"></span>#${rank}</span>
                        ${thumb ? `<img class="thumb" src="${escapeHtml(thumb)}" alt="${escapeHtml(item.judul)}" loading="lazy" onerror="this.style.display='none'">` :
                            `<div class="thumb-placeholder"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="8" y1="2" x2="8" y2="22"/><line x1="16" y1="2" x2="16" y2="22"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="2" y1="16" x2="22" y2="16"/></svg></div>`
                        }
                        <div class="tc-body">
                            <div class="tc-title">${escapeHtml(item.judul)}</div>
                            <div class="tc-meta">
                                <span>${escapeHtml(item.pembuat || 'Anonim')}</span>
                                <span class="tc-downloads">${formatNumber(item.downloads || 0)} unduh</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            function creatorCardHTML(creator) {
                return `
                    <div class="creator-card" data-creator="${escapeHtml(creator.name)}">
                        <div class="avatar">${getInitials(creator.name)}</div>
                        <div class="cc-name">${escapeHtml(creator.name)}</div>
                        <div class="cc-software">${creator.topSoftware ? escapeHtml(creator.topSoftware) : creator.count + ' preset'}</div>
                        <span class="cc-stat">${formatNumber(creator.downloads)} unduh</span>
                    </div>
                `;
            }

            function rankRowHTML(item, rank) {
                const thumb = item.thumbnail || '';
                return `
                    <div class="rank-row" data-id="${item.id}">
                        <span class="rr-num">${String(rank).padStart(2, '0')}</span>
                        ${thumb ? `<img class="rr-thumb" src="${escapeHtml(thumb)}" alt="${escapeHtml(item.judul)}" loading="lazy" onerror="this.style.display='none'">` :
                            `<div class="rr-thumb-placeholder"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="8" y1="2" x2="8" y2="22"/><line x1="16" y1="2" x2="16" y2="22"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="2" y1="16" x2="22" y2="16"/></svg></div>`
                        }
                        <div class="rr-info">
                            <div class="rr-title">${escapeHtml(item.judul)}</div>
                            <div class="rr-creator">${escapeHtml(item.pembuat || 'Anonim')}</div>
                        </div>
                        <div class="rr-count">${formatNumber(item.downloads || 0)}<small>unduh</small></div>
                    </div>
                `;
            }

            function sectionDivider(colorClass, title, meta) {
                return `
                    <div class="section-divider ${colorClass || ''}">
                        <span class="keyframe"></span>
                        <h2>${title}</h2>
                        <span class="ruler"></span>
                        ${meta ? `<span class="section-meta">${meta}</span>` : ''}
                    </div>
                `;
            }

            // ---------- render modes ----------
            function renderHome() {
                if (assets.length === 0) {
                    cardGrid.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                            <p>Belum ada preset di sini.</p>
                            <p style="font-size:0.85rem;color:var(--text-muted);">Jadilah kreator pertama — upload preset kamu sekarang.</p>
                        </div>
                    `;
                    return;
                }

                const trending = [...assets].sort((a, b) => heatScore(b) - heatScore(a)).slice(0, 6);
                const creators = aggregateCreators().slice(0, 8);
                const latest = [...assets].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 6);
                const topDownload = [...assets].sort((a, b) => (b.downloads || 0) - (a.downloads || 0)).slice(0, 5);

                let html = '';

                html += `<div class="section">`;
                html += sectionDivider('amber', '🔥 Trending Minggu Ini', trending.length + ' preset');
                html += `<div class="rail">${trending.map((item, i) => trendCardHTML(item, i + 1)).join('')}</div>`;
                html += `</div>`;

                if (creators.length > 0) {
                    html += `<div class="section">`;
                    html += sectionDivider('', '⭐ Creator Pilihan', creators.length + ' kreator');
                    html += `<div class="rail">${creators.map(creatorCardHTML).join('')}</div>`;
                    html += `</div>`;
                }

                html += `<div class="section">`;
                html += sectionDivider('mint', '🆕 Upload Terbaru', '');
                html += latest.map((item, i) => assetCardHTML(item, { newRibbon: i < 3 })).join('');
                html += `</div>`;

                html += `<div class="section">`;
                html += sectionDivider('', '🏆 Top Download', 'Top ' + topDownload.length);
                html += `<div class="rank-list">${topDownload.map((item, i) => rankRowHTML(item, i + 1)).join('')}</div>`;
                html += `</div>`;

                cardGrid.innerHTML = html;
            }

            function renderFlatGrid(list) {
                if (list.length === 0) {
                    cardGrid.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                            <p>Tidak ada preset ditemukan</p>
                            <p style="font-size:0.85rem;color:var(--text-muted);">Coba ubah filter atau upload preset baru</p>
                        </div>
                    `;
                    return;
                }
                cardGrid.innerHTML = list.map(item => assetCardHTML(item)).join('');
            }

            function render() {
                totalDesktop.textContent = assets.length;
                if (isHomeState()) {
                    renderHome();
                } else {
                    renderFlatGrid(getFiltered());
                }
            }

            // One delegated listener handles clicks across every section (home + flat grid),
            // since cards, trend rail, creator rail and rank rows all live inside #cardGrid.
            cardGrid.addEventListener('click', function(e) {
                const likeBtn = e.target.closest('[data-like]');
                const saveBtn = e.target.closest('[data-save]');
                const downloadBtn = e.target.closest('[data-download]');
                const creatorCard = e.target.closest('[data-creator]');
                const openable = e.target.closest('.asset-card, .trend-card, .rank-row');

                if (likeBtn) {
                    e.stopPropagation();
                    const idx = assets.findIndex(a => a.id === likeBtn.dataset.like);
                    if (idx !== -1) {
                        assets[idx].likes = (assets[idx].likes || 0) + 1;
                        assets[idx].favorite = !assets[idx].favorite;
                        assets[idx].updatedAt = Date.now();
                        save();
                        render();
                        showToast(assets[idx].favorite ? '❤️ Ditambahkan ke favorit' : '💔 Dihapus dari favorit', 'info');
                    }
                    return;
                }

                if (saveBtn) {
                    e.stopPropagation();
                    const idx = assets.findIndex(a => a.id === saveBtn.dataset.save);
                    if (idx !== -1) {
                        assets[idx].saves = (assets[idx].saves || 0) + 1;
                        assets[idx].updatedAt = Date.now();
                        save();
                        render();
                        showToast('📌 Disimpan ke koleksi', 'success');
                    }
                    return;
                }

                if (downloadBtn) {
                    e.stopPropagation();
                    const idx = assets.findIndex(a => a.id === downloadBtn.dataset.download);
                    if (idx !== -1) {
                        assets[idx].downloads = (assets[idx].downloads || 0) + 1;
                        assets[idx].updatedAt = Date.now();
                        save();
                        render();
                        if (assets[idx].linkDownload) {
                            window.open(assets[idx].linkDownload, '_blank');
                            showToast('⬇️ Memulai download...', 'success');
                        } else {
                            showToast('Link download tidak tersedia', 'error');
                        }
                    }
                    return;
                }

                if (creatorCard) {
                    openCreatorProfile(creatorCard.dataset.creator);
                    return;
                }

                if (openable) {
                    const id = openable.dataset.id;
                    const idx = assets.findIndex(a => a.id === id);
                    if (idx !== -1) {
                        assets[idx].views = (assets[idx].views || 0) + 1;
                        save();
                        openDetail(idx);
                    }
                }
            });

            // ---------- static per-software helper content (a real, ordered how-to — numbering is earned here) ----------
            const INSTALL_STEPS = {
                'After Effects': ['Ekstrak file .zip hasil download.', 'Buka After Effects, pilih Animation → Browse Presets.', 'Salin file .ffx ke folder Presets yang terbuka.', 'Restart After Effects, preset muncul di panel Effects & Presets.'],
                'Premiere Pro': ['Ekstrak file .zip hasil download.', 'Buka Premiere Pro, pilih Window → Effects.', 'Klik kanan pada folder Presets, pilih Import Presets.', 'Pilih file .prfpset yang sudah diekstrak.'],
                'CapCut': ['Buka file hasil download di aplikasi CapCut.', 'Preset otomatis tersimpan di menu Efek → Favorit.', 'Buka project kamu, tambahkan dari tab Favorit.'],
                'Alight Motion': ['Import file .alightmotion ke aplikasi.', 'Buka menu Assets → Import.', 'Pilih file preset, tunggu proses selesai.', 'Preset siap dipakai di timeline project kamu.'],
                'VN Video Editor': ['Ekstrak file hasil download.', 'Buka VN, masuk ke menu Preset di halaman edit.', 'Pilih Import, arahkan ke file yang sudah diekstrak.'],
                'DaVinci Resolve': ['Buka menu Color, klik kanan pada panel Gallery.', 'Pilih Import Still / Import LUT sesuai jenis file.', 'Arahkan ke file hasil download.', 'LUT siap dipakai di node color grading.'],
                'Universal': ['Ekstrak file hasil download.', 'Baca file README di dalamnya untuk instruksi spesifik software kamu.', 'Import sesuai petunjuk yang disertakan kreator.']
            };

            function getInstallSteps(software) {
                return INSTALL_STEPS[software] || INSTALL_STEPS['Universal'];
            }

            function faqHTML(item) {
                const faqs = [
                    ['Apakah preset ini bisa dipakai untuk konten komersial?', item.license === 'free'
                        ? 'Bisa. Preset gratis di PresetHub boleh dipakai untuk project pribadi maupun komersial, selama tidak dijual ulang mentah-mentah sebagai preset.'
                        : 'Bisa, sesuai lisensi Pro dari kreator. Tetap tidak boleh dijual ulang mentah-mentah sebagai file preset.'],
                    ['File tidak bisa dibuka, apa yang harus dilakukan?', `Pastikan versi ${escapeHtml(item.software || 'software')} kamu sudah diperbarui, lalu ekstrak ulang file .zip sebelum import.`],
                    ['Bisa request update atau bug report ke kreator?', 'Bisa lewat kolom komentar di bawah, kreator biasanya memantau dan membalas di sana.']
                ];
                return faqs.map(([q, a], i) => `
                    <div class="faq-item" data-faq="${i}">
                        <button class="faq-q" type="button">
                            ${q}
                            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        </button>
                        <div class="faq-a">${a}</div>
                    </div>
                `).join('');
            }

            function commentsHTML(assetId) {
                const map = loadComments();
                const list = map[assetId] || [];
                if (list.length === 0) {
                    return `<div class="comment-empty">Belum ada komentar. Jadi yang pertama kasih feedback ke kreator.</div>`;
                }
                return `<div class="comment-list">${list.map(c => `
                    <div class="comment-item">
                        <div class="avatar">${getInitials(c.author)}</div>
                        <div>
                            <span class="c-name">${escapeHtml(c.author)}</span><span class="c-time">${formatDate(c.ts)}</span>
                            <div class="c-text">${escapeHtml(c.text)}</div>
                        </div>
                    </div>
                `).join('')}</div>`;
            }

            function relatedAssets(item) {
                return assets.filter(a => a.id !== item.id && (
                    a.software === item.software ||
                    a.kategori === item.kategori ||
                    (a.tag || []).some(t => (item.tag || []).includes(t))
                )).slice(0, 6);
            }

            function otherByCreator(item) {
                return assets.filter(a => a.id !== item.id && a.pembuat === item.pembuat).slice(0, 6);
            }

            function openDetail(index) {
                const item = assets[index];
                if (!item) return;

                const youtubeId = item.linkYoutube ? getYoutubeId(item.linkYoutube) : null;
                const embedUrl = youtubeId ? embedYoutube(youtubeId) : null;

                const gallery = [item.thumbnail, ...(item.screenshots || [])].filter(Boolean);

                const tags = (item.tag || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
                const isFree = item.license === 'free';
                const isPro = item.license === 'pro';
                const badgeClass = isFree ? 'free' : 'pro';
                const badgeText = isFree ? 'Gratis' : 'Pro';

                const wasUpdated = item.updatedAt && item.updatedAt !== item.createdAt;
                const related = relatedAssets(item);
                const others = otherByCreator(item);

                const detailContent = document.getElementById('detailContent');
                detailContent.innerHTML = `
                    <div class="modal-header">
                        <h2>${escapeHtml(item.judul)}</h2>
                        <button class="modal-close" id="closeDetailModal">
                            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>

                    ${gallery.length > 0 ? `<div class="detail-gallery">${gallery.map(src => `<img src="${escapeHtml(src)}" alt="${escapeHtml(item.judul)}" onerror="this.style.display='none'">`).join('')}</div>` : ''}

                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.3rem;">
                        ${isFree || isPro ? `<span class="badge ${badgeClass}" style="font-size:0.7rem;font-weight:700;padding:0.1rem 0.6rem;border-radius:100px;">${badgeText}</span>` : ''}
                        ${item.software ? `<span style="font-size:0.75rem;background:var(--bg);padding:0.1rem 0.6rem;border-radius:100px;">${escapeHtml(item.software)}</span>` : ''}
                    </div>

                    <div class="detail-creator creator-link" id="detailCreatorLink">
                        <div class="avatar">${getInitials(item.pembuat)}</div>
                        <span class="name">${escapeHtml(item.pembuat || 'Anonim')}</span>
                        <span class="verified">
                            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        </span>
                    </div>

                    <div class="detail-stats">
                        <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatNumber(item.downloads || 0)} download</span>
                        <span><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> ${formatNumber(item.views || 0)} views</span>
                        <span><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${item.likes || 0}</span>
                    </div>

                    ${item.deskripsi ? `<div class="detail-desc">${escapeHtml(item.deskripsi)}</div>` : ''}
                    ${tags ? `<div class="detail-tags">${tags}</div>` : ''}
                    ${embedUrl ? `<div style="border-radius:var(--radius-xs);overflow:hidden;aspect-ratio:16/9;background:#000;margin:0.5rem 0;"><iframe src="${embedUrl}" style="width:100%;height:100%;border:none;" allowfullscreen></iframe></div>` : ''}

                    <button class="detail-download-btn" id="detailDownloadBtn">
                        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download Preset
                    </button>

                    <div class="detail-subhead"><span class="keyframe"></span>Kompatibilitas &amp; versi</div>
                    <div class="meta-line"><span>Software</span><b>${escapeHtml(item.software || 'Universal')}</b></div>
                    <div class="meta-line"><span>Kategori</span><b>${escapeHtml(item.kategori || '-')}</b></div>
                    <div class="meta-line"><span>Lisensi</span><b>${badgeText}</b></div>

                    <div class="detail-subhead"><span class="keyframe"></span>Riwayat update</div>
                    <div class="meta-line"><span>Diunggah</span><b>${formatDate(item.createdAt)}</b></div>
                    ${wasUpdated ? `<div class="meta-line"><span>Terakhir diperbarui</span><b>${formatDate(item.updatedAt)}</b></div>` : ''}

                    <div class="detail-subhead"><span class="keyframe"></span>Cara install</div>
                    <ol class="install-steps">${getInstallSteps(item.software).map(s => `<li>${s}</li>`).join('')}</ol>

                    <div class="detail-subhead"><span class="keyframe"></span>FAQ</div>
                    <div id="detailFaq">${faqHTML(item)}</div>

                    ${others.length > 0 ? `
                        <div class="detail-subhead"><span class="keyframe"></span>Preset lain dari ${escapeHtml(item.pembuat || 'kreator ini')}</div>
                        <div class="rail">${others.map((a, i) => trendCardHTML(a, i + 1).replace('trend-card', 'trend-card mini')).join('')}</div>
                    ` : ''}

                    ${related.length > 0 ? `
                        <div class="detail-subhead"><span class="keyframe"></span>Preset terkait</div>
                        <div class="rail">${related.map((a, i) => trendCardHTML(a, i + 1).replace('trend-card', 'trend-card mini')).join('')}</div>
                    ` : ''}

                    <div class="detail-subhead"><span class="keyframe"></span>Komentar</div>
                    <div id="detailComments">${commentsHTML(item.id)}</div>
                    <div class="comment-form">
                        <textarea id="commentInput" placeholder="Tulis komentar atau pertanyaan..."></textarea>
                        <button id="commentSubmit" type="button">Kirim</button>
                    </div>

                    <div style="font-size:0.7rem;color:var(--text-muted);text-align:center;margin-top:1rem;">
                        Diupload ${formatDate(item.createdAt)} · Diupdate ${formatDate(item.updatedAt)}
                    </div>
                `;

                detailModal.classList.add('active');

                document.getElementById('closeDetailModal').addEventListener('click', function() {
                    detailModal.classList.remove('active');
                });

                document.getElementById('detailDownloadBtn').addEventListener('click', function() {
                    if (item.linkDownload) {
                        assets[index].downloads = (assets[index].downloads || 0) + 1;
                        save();
                        window.open(item.linkDownload, '_blank');
                        showToast('⬇️ Memulai download...', 'success');
                    } else {
                        showToast('Link download tidak tersedia', 'error');
                    }
                });

                document.getElementById('detailCreatorLink').addEventListener('click', function() {
                    detailModal.classList.remove('active');
                    openCreatorProfile(item.pembuat || 'Anonim');
                });

                document.getElementById('detailFaq').querySelectorAll('.faq-item').forEach(faq => {
                    faq.querySelector('.faq-q').addEventListener('click', function() {
                        faq.classList.toggle('open');
                    });
                });

                document.getElementById('commentSubmit').addEventListener('click', function() {
                    const input = document.getElementById('commentInput');
                    const text = input.value.trim();
                    if (!text) return;
                    const map = loadComments();
                    if (!map[item.id]) map[item.id] = [];
                    map[item.id].push({ author: 'Kamu', text, ts: Date.now() });
                    saveComments(map);
                    document.getElementById('detailComments').innerHTML = commentsHTML(item.id);
                    input.value = '';
                    showToast('💬 Komentar terkirim', 'success');
                });

                detailContent.querySelectorAll('.rail [data-id]').forEach(card => {
                    card.addEventListener('click', function() {
                        const idx = assets.findIndex(a => a.id === this.dataset.id);
                        if (idx !== -1) {
                            detailModal.classList.remove('active');
                            openDetail(idx);
                        }
                    });
                });

                detailModal.addEventListener('click', function(e) {
                    if (e.target === this) detailModal.classList.remove('active');
                });
            }

            // ---------- creator profile ----------
            function openCreatorProfile(name) {
                const creatorAssets = assets.filter(a => (a.pembuat || 'Anonim') === name);
                if (creatorAssets.length === 0) return;

                const downloads = creatorAssets.reduce((s, a) => s + (a.downloads || 0), 0);
                const likes = creatorAssets.reduce((s, a) => s + (a.likes || 0), 0);
                const softwareCounts = {};
                creatorAssets.forEach(a => { if (a.software) softwareCounts[a.software] = (softwareCounts[a.software] || 0) + 1; });
                const softwareList = Object.keys(softwareCounts).sort((a, b) => softwareCounts[b] - softwareCounts[a]);
                const joined = Math.min(...creatorAssets.map(a => a.createdAt || Date.now()));
                const follows = loadFollows();
                const isFollowing = follows.includes(name);

                const bio = `Kreator preset ${softwareList.length ? escapeHtml(softwareList[0]) : 'video editing'} · sudah membagikan ${creatorAssets.length} preset ke komunitas PresetHub.`;

                const content = document.getElementById('creatorContent');
                content.innerHTML = `
                    <div class="modal-header">
                        <h2>Profil Kreator</h2>
                        <button class="modal-close" id="closeCreatorModal">
                            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div class="creator-banner"></div>
                    <div class="creator-profile-head">
                        <div class="avatar">${getInitials(name)}</div>
                        <div class="cp-info">
                            <div class="cp-name">${escapeHtml(name)}
                                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            </div>
                            <div class="cp-joined">Bergabung ${formatDate(joined)}</div>
                        </div>
                        <button class="btn-follow ${isFollowing ? 'following' : ''}" id="followBtn">${isFollowing ? 'Mengikuti' : 'Ikuti'}</button>
                    </div>
                    <div class="creator-bio">${bio}</div>
                    <div class="creator-badge-row">${softwareList.map(s => `<span>${escapeHtml(s)}</span>`).join('')}</div>
                    <div class="creator-stats-grid">
                        <div class="stat"><div class="num">${creatorAssets.length}</div><div class="lbl">Preset</div></div>
                        <div class="stat"><div class="num">${formatNumber(downloads)}</div><div class="lbl">Unduhan</div></div>
                        <div class="stat"><div class="num">${formatNumber(likes)}</div><div class="lbl">Like</div></div>
                        <div class="stat"><div class="num">${formatNumber(follows.length && isFollowing ? 128 : 127)}</div><div class="lbl">Pengikut</div></div>
                    </div>
                    <div class="detail-subhead"><span class="keyframe"></span>Preset dari ${escapeHtml(name)}</div>
                    ${creatorAssets.map(a => assetCardHTML(a)).join('')}
                `;

                creatorModal.classList.add('active');

                document.getElementById('closeCreatorModal').addEventListener('click', function() {
                    creatorModal.classList.remove('active');
                });

                document.getElementById('followBtn').addEventListener('click', function() {
                    let list = loadFollows();
                    if (list.includes(name)) {
                        list = list.filter(n => n !== name);
                        showToast('Berhenti mengikuti ' + name, 'info');
                    } else {
                        list.push(name);
                        showToast('✅ Mengikuti ' + name, 'success');
                    }
                    saveFollows(list);
                    this.classList.toggle('following');
                    this.textContent = list.includes(name) ? 'Mengikuti' : 'Ikuti';
                });

                content.querySelectorAll('.asset-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('[data-like],[data-save],[data-download]')) return;
                        const idx = assets.findIndex(a => a.id === this.dataset.id);
                        if (idx !== -1) {
                            creatorModal.classList.remove('active');
                            openDetail(idx);
                        }
                    });
                });

                content.querySelectorAll('[data-like],[data-save],[data-download]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.like || this.dataset.save || this.dataset.download;
                        const idx = assets.findIndex(a => a.id === id);
                        if (idx === -1) return;
                        if (this.dataset.like) {
                            assets[idx].likes = (assets[idx].likes || 0) + 1;
                            assets[idx].favorite = !assets[idx].favorite;
                        } else if (this.dataset.save) {
                            assets[idx].saves = (assets[idx].saves || 0) + 1;
                        } else if (this.dataset.download) {
                            assets[idx].downloads = (assets[idx].downloads || 0) + 1;
                            if (assets[idx].linkDownload) window.open(assets[idx].linkDownload, '_blank');
                        }
                        assets[idx].updatedAt = Date.now();
                        save();
                        openCreatorProfile(name);
                    });
                });

                creatorModal.addEventListener('click', function(e) {
                    if (e.target === this) creatorModal.classList.remove('active');
                });
            }

            function getFormData() {
                return {
                    id: randomId(),
                    judul: fJudul.value.trim(),
                    pembuat: fPembuat.value.trim() || 'Anonim',
                    kategori: fKategori.value,
                    tag: fTag.value.split(',').map(s => s.trim()).filter(Boolean),
                    software: fSoftware.value,
                    deskripsi: fDeskripsi.value.trim(),
                    thumbnail: fThumbnail.value.trim(),
                    screenshots: fScreenshots.value.split(',').map(s => s.trim()).filter(Boolean),
                    linkDownload: fLinkDownload.value.trim(),
                    linkYoutube: fLinkYoutube.value.trim(),
                    license: fLicense.value,
                    likes: 0,
                    saves: 0,
                    downloads: 0,
                    views: 0,
                    favorite: false,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
            }

            function resetForm() {
                fJudul.value = '';
                fPembuat.value = '';
                fKategori.value = '';
                fTag.value = '';
                fSoftware.value = '';
                fDeskripsi.value = '';
                fThumbnail.value = '';
                fScreenshots.value = '';
                fLinkDownload.value = '';
                fLinkYoutube.value = '';
                fLicense.value = 'free';
                submitBtn.textContent = 'Publikasikan';
                modalTitle.textContent = 'Upload Preset';
                editIndex = null;
            }

            function handleSubmit(e) {
                e.preventDefault();
                const data = getFormData();

                if (!data.judul) {
                    showToast('Nama preset wajib diisi', 'error');
                    fJudul.focus();
                    return;
                }
                if (!data.linkDownload) {
                    showToast('Link download wajib diisi', 'error');
                    fLinkDownload.focus();
                    return;
                }
                if (data.linkYoutube) {
                    const id = getYoutubeId(data.linkYoutube);
                    if (!id) {
                        showToast('Format YouTube tidak valid', 'error');
                        fLinkYoutube.focus();
                        return;
                    }
                }

                if (editIndex !== null) {
                    data.createdAt = assets[editIndex].createdAt;
                    data.likes = assets[editIndex].likes || 0;
                    data.saves = assets[editIndex].saves || 0;
                    data.downloads = assets[editIndex].downloads || 0;
                    data.views = assets[editIndex].views || 0;
                    data.favorite = assets[editIndex].favorite || false;
                    data.id = assets[editIndex].id || randomId();
                    assets[editIndex] = data;
                    showToast('✅ Preset berhasil diupdate', 'success');
                } else {
                    assets.push(data);
                    showToast('✅ Preset berhasil dipublikasikan!', 'success');
                }

                save();
                resetForm();
                render();
                uploadModal.classList.remove('active');
            }

            function setView(view) {
                currentView = view;
                document.querySelectorAll('.sidebar-desktop nav button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === view);
                });
                render();
            }

            function setChip(filter) {
                currentChip = filter;
                document.querySelectorAll('.filter-chips .chip').forEach(c => {
                    c.classList.toggle('active', c.dataset.filter === filter);
                });
                render();
            }

            function setNav(nav) {
                document.querySelectorAll('.bottom-nav .nav-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.nav === nav);
                });
                if (nav === 'home') {
                    currentView = 'all';
                    document.querySelectorAll('.sidebar-desktop nav button').forEach(b => {
                        b.classList.toggle('active', b.dataset.view === 'all');
                    });
                    render();
                } else if (nav === 'search') {
                    searchInput.focus();
                } else if (nav === 'saved') {
                    currentView = 'favorites';
                    document.querySelectorAll('.sidebar-desktop nav button').forEach(b => {
                        b.classList.toggle('active', b.dataset.view === 'favorites');
                    });
                    render();
                } else if (nav === 'profile') {
                    showToast('👤 Profil kreator (coming soon)', 'info');
                }
            }

            function init() {
                load();

                document.querySelectorAll('.sidebar-desktop nav button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        setView(this.dataset.view);
                    });
                });

                document.querySelectorAll('.filter-chips .chip').forEach(chip => {
                    chip.addEventListener('click', function() {
                        setChip(this.dataset.filter);
                    });
                });

                document.querySelectorAll('.bottom-nav .nav-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        setNav(this.dataset.nav);
                    });
                });

                fabUpload.addEventListener('click', function() {
                    resetForm();
                    uploadModal.classList.add('active');
                });

                document.querySelectorAll('.header-actions .btn-icon').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (this.id === 'notifBtn') {
                            showToast('🔔 Belum ada notifikasi', 'info');
                        } else if (this.id === 'profileBtn') {
                            showToast('👤 Profil kreator (coming soon)', 'info');
                        }
                    });
                });

                closeUpload.addEventListener('click', function() {
                    uploadModal.classList.remove('active');
                });

                uploadModal.addEventListener('click', function(e) {
                    if (e.target === this) uploadModal.classList.remove('active');
                });

                searchInput.addEventListener('input', render);

                document.getElementById('uploadForm').addEventListener('submit', handleSubmit);

                document.getElementById('resetBtn').addEventListener('click', function(e) {
                    e.preventDefault();
                    resetForm();
                });

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        if (uploadModal.classList.contains('active')) uploadModal.classList.remove('active');
                        if (detailModal.classList.contains('active')) detailModal.classList.remove('active');
                        if (creatorModal.classList.contains('active')) creatorModal.classList.remove('active');
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        searchInput.focus();
                    }
                });

                render();
                showToast('🎬 PresetHub siap digunakan', 'info');
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>

</body>
</html>
