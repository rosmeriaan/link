                const dlLink = assets[idx].linkDrive || assets[idx].linkProject;
                if (dlLink) { window.open(dlLink, '_blank'); showToast('⬇️ Memulai download...', 'success'); }
                else showToast('Link download tidak tersedia', 'error');
                render();
            }
            return;
        }
        if (card) {
            const idx = assets.findIndex(a => a.id === card.dataset.id);
            if (idx !== -1) {
                assets[idx].views = (assets[idx].views || 0) + 1;
                save(); openDetail(idx);
            }
        }
    });

    document.querySelectorAll('.sidebar-desktop nav button').forEach(btn => {
        btn.addEventListener('click', function() {
            currentView = this.dataset.view;
            document.querySelectorAll('.sidebar-desktop nav button').forEach(b => b.classList.toggle('active', b === this));
            if (currentView === 'creators') renderCreatorDirectory();
            else render();
        });
    });

    document.querySelectorAll('.bottom-nav .nav-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const nav = this.dataset.nav;
            document.querySelectorAll('.bottom-nav .nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === nav));
            if (nav === 'home') { currentView = 'all'; render(); }
            else if (nav === 'search') { currentView = 'search'; renderSearchPage(); }
            else if (nav === 'saved') { currentView = 'favorites'; render(); }
            else if (nav === 'creators') { currentView = 'creators'; renderCreatorDirectory(); }
        });
    });

    document.querySelectorAll('.filter-chips .chip').forEach(chip => {
        chip.addEventListener('click', function() {
            currentChip = this.dataset.filter;
            document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.toggle('active', c === this));
            render();
        });
    });

    document.getElementById('fabUpload').addEventListener('click', function() {
        resetForm(); uploadModal.classList.add('active');
    });

    document.getElementById('closeUploadModal').addEventListener('click', () => uploadModal.classList.remove('active'));
    document.getElementById('closeRegisterModal').addEventListener('click', () => registerCreatorModal.classList.remove('active'));
    document.getElementById('cancelRegister').addEventListener('click', (e) => { e.preventDefault(); registerCreatorModal.classList.remove('active'); });

    [uploadModal, detailModal, registerCreatorModal].forEach(modal => {
        modal.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
    });

    fLicense.addEventListener('change', function() {
        if (this.value === 'paid') { priceWrapper.classList.add('active'); fHarga.setAttribute('required', 'required'); }
        else { priceWrapper.classList.remove('active'); fHarga.removeAttribute('required'); fHarga.value = ''; }
    });

    searchInput.addEventListener('input', render);
    document.getElementById('uploadForm').addEventListener('submit', handleSubmit);
    document.getElementById('resetBtn').addEventListener('click', function(e) { e.preventDefault(); resetForm(); });

    document.getElementById('registerCreatorForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const nama = document.getElementById('rNama').value.trim();
        if (!nama) { showToast('Nama kreator wajib diisi', 'error'); return; }
        const creators = loadCreators();
        if (creators.some(c => c.name.toLowerCase() === nama.toLowerCase())) { showToast('Kreator sudah terdaftar', 'error'); return; }
        creators.push({
            name: nama, bio: document.getElementById('rBio').value.trim(),
            software: document.getElementById('rSoftware').value,
            portfolio: document.getElementById('rPortfolio').value.trim(), registeredAt: Date.now()
        });
        saveCreators(creators);
        showToast('✅ Selamat! Anda sekarang kreator verified!', 'success');
        document.getElementById('registerCreatorForm').reset();
        registerCreatorModal.classList.remove('active');
        if (currentView === 'creators') renderCreatorDirectory();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            uploadModal.classList.remove('active');
            detailModal.classList.remove('active');
            registerCreatorModal.classList.remove('active');
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); }
    });

    document.getElementById('notifBtn').addEventListener('click', () => showToast('🔔 Belum ada notifikasi', 'info'));

    function init() {
        load();
        render();
        showToast('🎬 PresetHub siap digunakan', 'info');
    }

    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
