<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#14151c" />
    <title>PresetHub · Komunitas Kreator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
/* ============================================================
   VARIABLES
   Design tokens: color, type, spacing, radius, shadow, motion.
   ============================================================ */

        /* ============================================================
           VARIABLES & RESET
           ============================================================ */
        :root {
            /* Paper + ink: warm, slightly cool-gray paper against near-black ink (not the generic cream/terracotta pairing) */
            --bg: #F0EFEA;
            --surface: #ffffff;
            --surface-card: #ffffff;
            --border: #E4E1D8;
            --border-light: #EDEBE3;
            --text: #16171D;
            --text-secondary: #63625B;
            --text-muted: #9C9B92;
            --ink: #14151C;

            /* Signal violet: this app's one true accent — a creative-software violet, not SaaS blue */
            --accent: #5B4EFF;
            --accent-hover: #4636E0;
            --accent-light: #EEECFF;

            /* Amber = energy / trending / live. Mint = free / success. Used sparingly, never as primary. */
            --amber: #FFB800;
            --amber-light: #FFF3D6;
            --amber-ink: #8A5700;
            --mint: #00B589;
            --mint-light: #DEFBF3;
            --mint-ink: #0B6B54;

            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --shadow: 0 1px 3px rgba(20,21,28,0.05);
            --shadow-md: 0 4px 20px rgba(20,21,28,0.08);
            --shadow-lg: 0 8px 40px rgba(20,21,28,0.14);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);

            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-display: 'Space Grotesk', var(--font);
            --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --nav-height: 64px;
        }

/* ============================================================
   BASE / RESET
   Global resets, scrollbars, app shell.
   ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }

        ::-webkit-scrollbar-track { background: transparent; }

        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: calc(var(--nav-height) + 16px + var(--safe-bottom));
        }

        /* ---- utilities ----
           Small, composable — reach for these instead of new one-off rules
           when a layout only needs flex/spacing, nothing component-specific. */
        .flex { display: flex; }
        .flex-wrap { display: flex; flex-wrap: wrap; }
        .center { align-items: center; justify-content: center; }
        .gap-4 { gap: 0.25rem; }
        .gap-8 { gap: 0.5rem; }
        .gap-16 { gap: 1rem; }
        .mt-8 { margin-top: 0.5rem; }
        .mt-16 { margin-top: 1rem; }
        .mb-8 { margin-bottom: 0.5rem; }
        .mb-16 { margin-bottom: 1rem; }
        .hidden { display: none !important; }

/* ============================================================
   HEADER & FILTER CHIPS
   ============================================================ */

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            flex-shrink: 0;
        }

        .header-brand svg {
            width: 28px;
            height: 28px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-brand span { color: var(--accent); }

        .header-search {
            flex: 1;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg);
            border-radius: 100px;
            padding: 0.35rem 1rem;
            transition: var(--transition);
        }

        .header-search:focus-within {
            background: var(--surface);
            box-shadow: 0 0 0 2px var(--accent);
        }

        .header-search svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .header-search input {
            border: none;
            background: transparent;
            padding: 0.45rem 0;
            width: 100%;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
            color: var(--text);
        }

        .header-search input::placeholder {
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .header-actions .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--text-secondary);
            position: relative;
        }

        .header-actions .btn-icon:hover,
        .header-actions .btn-icon:active {
            background: var(--bg);
        }

        .header-actions .btn-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-actions .btn-icon .badge-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--surface);
        }

        .filter-chips {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 60px;
            z-index: 40;
        }

        .filter-chips::-webkit-scrollbar { display: none; }

        .filter-chips .chip {
            flex-shrink: 0;
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--bg);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .filter-chips .chip:active {
            transform: scale(0.96);
        }

        .filter-chips .chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .filter-chips .chip svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

/* ============================================================
   NAVIGATION
   Bottom nav (mobile), sidebar (desktop), FAB.
   ============================================================ */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(var(--nav-height) + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .bottom-nav .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.1rem;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 0.6rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            padding: 0.3rem 0.8rem;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            min-height: 44px;
            min-width: 44px;
        }

        .bottom-nav .nav-btn:active {
            transform: scale(0.92);
        }

        .bottom-nav .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bottom-nav .nav-btn.active {
            color: var(--accent);
        }

        .bottom-nav .nav-btn .nav-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .bottom-nav .nav-btn .badge-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--surface);
        }

        .fab {
            position: fixed;
            bottom: calc(var(--nav-height) + 20px + var(--safe-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            border: none;
            box-shadow: 0 4px 20px rgba(91, 78, 255, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 90;
            -webkit-tap-highlight-color: transparent;
        }

        .fab:active {
            transform: scale(0.92);
        }

        .fab svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-desktop {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 220px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            flex-direction: column;
            z-index: 10;
            overflow-y: auto;
        }

        .sidebar-desktop .brand {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar-desktop .brand svg {
            width: 28px;
            height: 28px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-desktop .brand span { color: var(--accent); }

        .sidebar-desktop nav {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
        }

        .sidebar-desktop nav button {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border: none;
            background: transparent;
            border-radius: var(--radius-xs);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            text-align: left;
        }

        .sidebar-desktop nav button:hover {
            background: var(--bg);
            color: var(--text);
        }

        .sidebar-desktop nav button.active {
            background: var(--accent-light);
            color: var(--accent);
        }

        .sidebar-desktop nav button svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .sidebar-desktop .footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.7rem;
            color: var(--text-muted);
        }

/* ============================================================
   HOME SECTIONS
   Section dividers (timeline-ruler signature), rails, trending/creator/rank cards.
   ============================================================ */

        .main {
            flex: 1;
            padding: 0.75rem 1rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
           HOME — SIGNATURE SECTION DIVIDER (timeline ruler)
           A horizontal ruler with tick marks + a filled keyframe diamond,
           echoing the editing-software timeline this whole app is about.
           ============================================================ */
        .section {
            margin-bottom: 1.75rem;
        }

        .section-divider {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.85rem;
            padding-top: 0.15rem;
        }

        .section-divider .keyframe {
            width: 9px;
            height: 9px;
            background: var(--accent);
            border-radius: 2px;
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        .section-divider.amber .keyframe { background: var(--amber); }

        .section-divider.mint .keyframe { background: var(--mint); }

        .section-divider h2 {
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .section-divider .ruler {
            flex: 1;
            height: 1px;
            background-image: repeating-linear-gradient(90deg, var(--border) 0, var(--border) 1px, transparent 1px, transparent 8px);
        }

        .section-divider .section-meta {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* Horizontal rail (used by trending + creator strips) */
        .rail {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 0.15rem;
            margin: 0 -1rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .rail::-webkit-scrollbar { display: none; }

        /* ---- Trending card (large, featured) ---- */
        .trend-card {
            flex: 0 0 auto;
            width: 78vw;
            max-width: 300px;
            scroll-snap-align: start;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .trend-card:active { transform: scale(0.98); }

        .trend-card .rank {
            position: absolute;
            top: 0.6rem;
            left: 0.6rem;
            z-index: 2;
            background: rgba(20,21,28,0.72);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .trend-card .rank .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--amber);
            flex-shrink: 0;
        }

        .trend-card .thumb {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: contain;
            background-color: #0f172a;
            display: block;
        }

        .trend-card .thumb-placeholder {
            width: 100%;
            aspect-ratio: 16/10;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trend-card .thumb-placeholder svg {
            width: 40px; height: 40px;
            stroke: #52525b; fill: none; stroke-width: 1.5;
        }

        .trend-card .tc-body {
            padding: 0.7rem 0.85rem 0.85rem;
        }

        .trend-card .tc-title {
            font-family: var(--font-display);
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.25;
            margin-bottom: 0.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .trend-card .tc-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .trend-card .tc-meta .tc-downloads {
            font-family: var(--font-mono);
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ---- Creator spotlight card ---- */
        .creator-card {
            flex: 0 0 auto;
            width: 132px;
            scroll-snap-align: start;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem 0.75rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .creator-card:active { transform: scale(0.96); }

        .creator-card .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent-light);
            color: var(--accent);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.5rem;
        }

        .creator-card .cc-name {
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.25;
            margin-bottom: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .creator-card .cc-software {
            font-size: 0.66rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .creator-card .cc-stat {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--accent);
            background: var(--accent-light);
            border-radius: 100px;
            padding: 0.15rem 0.5rem;
            display: inline-block;
        }

        /* ---- NEW ribbon for latest uploads ---- */
        .ribbon-new {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            z-index: 2;
            background: var(--mint);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.15rem 0.5rem;
            border-radius: 100px;
        }

        .card-media-wrap { position: relative; }

        /* ---- Top download ranked rows ---- */
        .rank-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.25rem;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: var(--transition);
        }

        .rank-row:last-child { border-bottom: none; }

        .rank-row:active { background: var(--bg); }

        .rank-row .rr-num {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            width: 1.6rem;
            flex-shrink: 0;
            text-align: center;
        }

        .rank-row:nth-child(1) .rr-num { color: var(--amber-ink); }

        .rank-row:nth-child(2) .rr-num { color: var(--text-secondary); }

        .rank-row:nth-child(3) .rr-num { color: var(--text-secondary); }

        .rank-row .rr-thumb {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-xs);
            object-fit: cover;
            background: #0f172a;
            flex-shrink: 0;
        }

        .rank-row .rr-thumb-placeholder {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-xs);
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rank-row .rr-thumb-placeholder svg {
            width: 20px; height: 20px; stroke: #52525b; fill: none; stroke-width: 1.5;
        }

        .rank-row .rr-info {
            flex: 1;
            min-width: 0;
        }

        .rank-row .rr-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-row .rr-creator {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-row .rr-count {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
            text-align: right;
        }

        .rank-row .rr-count small {
            display: block;
            font-family: var(--font);
            font-weight: 400;
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .rank-list {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.25rem 0.85rem;
        }

/* ============================================================
   ASSET CARD
   The core preset card used in grids and lists.
   Selectors here are kept to a max of two levels — see
   asset-title / asset-actions / asset-like etc below instead of
   chains like ".asset-card .body .actions .btn-download".
   ============================================================ */

        .asset-card {
            background: var(--surface-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 1rem;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .asset-card:active {
            transform: scale(0.99);
        }

        .asset-card .thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--bg);
            object-fit: contain;
            display: block;
            background-color: #0f172a;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .asset-card .thumb-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .asset-card .thumb-placeholder svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 1.5;
        }

        .asset-card .body {
            padding: 0.75rem 1rem 1rem;
        }

        .asset-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .asset-title {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .asset-badges {
            display: flex;
            gap: 0.3rem;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .asset-badges .badge {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 0.1rem 0.5rem;
            border-radius: 100px;
            background: var(--bg);
            color: var(--text-secondary);
        }

        .asset-badges .badge.free {
            background: var(--mint-light);
            color: var(--mint-ink);
        }

        .asset-badges .badge.pro {
            background: var(--amber-light);
            color: var(--amber-ink);
        }

        .asset-badges .badge.featured {
            background: var(--accent-light);
            color: var(--accent-hover);
        }

        .asset-creator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.4rem 0 0.25rem;
        }

        .asset-creator .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--accent);
            flex-shrink: 0;
            overflow: hidden;
        }

        .asset-creator .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .asset-creator .name {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color 0.15s ease;
        }

        .asset-creator .verified {
            display: inline-flex;
            align-items: center;
        }

        .asset-creator .verified svg {
            width: 14px;
            height: 14px;
            stroke: var(--accent);
            fill: var(--accent);
        }

        .asset-stats {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .asset-stats span {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .asset-stats svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .asset-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }

        .asset-tags .tag {
            font-size: 0.65rem;
            padding: 0.05rem 0.6rem;
            border-radius: 100px;
            background: var(--bg);
            color: var(--text-secondary);
        }

        .asset-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }

        /* Buttons get a snappier 0.15s — they're the most-tapped element on the page */
        .asset-like,
        .asset-save {
            background: none;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: transform 0.15s ease, color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .asset-like:active,
        .asset-save:active {
            transform: scale(0.92);
        }

        .asset-like svg,
        .asset-save svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .asset-like.active svg {
            fill: #ef4444;
            stroke: #ef4444;
        }

        .asset-save.active svg {
            fill: var(--accent);
            stroke: var(--accent);
        }

        .asset-download {
            margin-left: auto;
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: var(--radius-xs);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .asset-download:active {
            transform: scale(0.95);
        }

        .asset-download svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 56px;
            height: 56px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 0.75rem;
        }

/* ============================================================
   MODALS
   Bottom sheets: upload, detail page, creator profile.
   ============================================================ */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            padding: 1.5rem 1rem calc(var(--safe-bottom) + 1rem);
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-sheet {
            background: var(--surface);
            border-radius: var(--radius) var(--radius) 0 0;
            max-width: 600px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 1.5rem 1.25rem 2rem;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            border-bottom: none;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-sheet .handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 0 auto 1.25rem;
            flex-shrink: 0;
        }

        .modal-sheet .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-sheet .modal-header h2 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-sheet .modal-close {
            background: none;
            border: none;
            padding: 0.25rem;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .modal-sheet .modal-close:active {
            transform: scale(0.92);
        }

        .modal-sheet .modal-close svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .detail-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f172a;
            border-radius: var(--radius-sm);
            object-fit: contain;
            margin-bottom: 0.75rem;
        }

        .detail-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.1rem;
        }

        .detail-creator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.3rem 0 0.5rem;
        }

        .detail-creator .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent);
            flex-shrink: 0;
            overflow: hidden;
        }

        .detail-creator .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-creator .name {
            font-weight: 500;
        }

        .detail-creator .verified svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent);
            fill: var(--accent);
        }

        .detail-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin: 0.5rem 0;
        }

        .detail-stats span {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .detail-stats svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .detail-desc {
            margin: 0.5rem 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin: 0.5rem 0;
        }

        .detail-tags .tag {
            background: var(--bg);
            padding: 0.1rem 0.7rem;
            border-radius: 100px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .detail-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }

        .detail-links a {
            font-size: 0.8rem;
            padding: 0.2rem 0.8rem;
            border-radius: 100px;
            background: var(--bg);
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .detail-links a:active {
            transform: scale(0.96);
        }

        .detail-links a:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .detail-download-btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: var(--radius-xs);
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.75rem 0 0.5rem;
            -webkit-tap-highlight-color: transparent;
        }

        .detail-download-btn:active {
            transform: scale(0.97);
        }

        .detail-download-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           DETAIL PAGE — gallery, sections, install steps, FAQ, comments
           ============================================================ */
        .detail-gallery {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin-bottom: 0.75rem;
        }

        .detail-gallery::-webkit-scrollbar { display: none; }

        .detail-gallery img {
            flex: 0 0 auto;
            width: 88%;
            aspect-ratio: 16/9;
            object-fit: contain;
            background: #0f172a;
            border-radius: var(--radius-sm);
            scroll-snap-align: start;
        }

        .detail-gallery .dot-count {
            position: absolute;
        }

        .detail-subhead {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            margin: 1.1rem 0 0.5rem;
        }

        .detail-subhead .keyframe {
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 2px;
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        .install-steps {
            list-style: none;
            counter-reset: step;
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .install-steps li {
            counter-increment: step;
            display: flex;
            gap: 0.6rem;
            padding: 0.4rem 0;
        }

        .install-steps li::before {
            content: counter(step);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-light);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .meta-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
        }

        .meta-line:last-child { border-bottom: none; }

        .meta-line b { color: var(--text); font-weight: 600; }

        .faq-item {
            border-bottom: 1px solid var(--border-light);
        }

        .faq-item:last-child { border-bottom: none; }

        .faq-item .faq-q {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            padding: 0.65rem 0;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }

        .faq-item .faq-q svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .faq-item.open .faq-q svg { transform: rotate(45deg); }

        .faq-item .faq-a {
            max-height: 0;
            overflow: hidden;
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.55;
            transition: max-height 0.25s ease;
        }

        .faq-item.open .faq-a {
            max-height: 240px;
            padding-bottom: 0.65rem;
        }

        .comment-list { margin-bottom: 0.75rem; }

        .comment-item {
            display: flex;
            gap: 0.55rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border-light);
        }

        .comment-item:last-child { border-bottom: none; }

        .comment-item .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--accent-light);
            color: var(--accent);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .comment-item .c-name {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .comment-item .c-time {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-left: 0.4rem;
            font-weight: 400;
        }

        .comment-item .c-text {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 0.15rem;
            line-height: 1.45;
        }

        .comment-empty {
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 0.5rem 0 0.75rem;
        }

        .comment-form {
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
        }

        .comment-form textarea {
            flex: 1;
            min-height: 40px;
            resize: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 0.5rem 0.7rem;
            font-family: inherit;
            font-size: 0.82rem;
            background: var(--surface);
            color: var(--text);
        }

        .comment-form textarea:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: transparent;
        }

        .comment-form button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-xs);
            padding: 0.5rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .comment-form button:active { transform: scale(0.95); }

        /* Compact mini-card used inside detail rails ("asset lain", "terkait") */
        .trend-card.mini { width: 150px; }

        .trend-card.mini .rank { display: none; }

        .trend-card.mini .tc-title { font-size: 0.8rem; }

        .trend-card.mini .tc-meta { font-size: 0.66rem; }

        .creator-link {
            cursor: pointer;
        }

        .creator-link:hover .name { text-decoration: underline; }

        /* ============================================================
           CREATOR PROFILE MODAL
           ============================================================ */
        .creator-banner {
            height: 84px;
            border-radius: var(--radius-sm);
            background: linear-gradient(120deg, var(--accent) 0%, #8B7FFF 55%, var(--amber) 130%);
            margin-bottom: -34px;
            position: relative;
        }

        .creator-profile-head {
            display: flex;
            align-items: flex-end;
            gap: 0.75rem;
            padding: 0 0.25rem;
        }

        .creator-profile-head .avatar {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--accent-light);
            color: var(--accent);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--surface);
            flex-shrink: 0;
        }

        .creator-profile-head .cp-info {
            flex: 1;
            padding-bottom: 0.2rem;
            min-width: 0;
        }

        .creator-profile-head .cp-name {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .creator-profile-head .cp-name svg {
            width: 16px; height: 16px;
            stroke: var(--accent); fill: var(--accent);
            flex-shrink: 0;
        }

        .creator-profile-head .cp-joined {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .btn-follow {
            border: 1.5px solid var(--accent);
            background: var(--accent);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 1.1rem;
            border-radius: 100px;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            margin-bottom: 0.2rem;
        }

        .btn-follow:active { transform: scale(0.95); }

        .btn-follow.following {
            background: transparent;
            color: var(--accent);
        }

        .creator-bio {
            font-size: 0.84rem;
            color: var(--text-secondary);
            line-height: 1.55;
            margin: 0.85rem 0 0.9rem;
        }

        .creator-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 0.75rem 0.5rem;
            margin-bottom: 1rem;
        }

        .creator-stats-grid .stat {
            text-align: center;
        }

        .creator-stats-grid .stat .num {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }

        .creator-stats-grid .stat .lbl {
            font-size: 0.62rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-top: 0.1rem;
        }

        .creator-badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .creator-badge-row span {
            font-size: 0.72rem;
            background: var(--accent-light);
            color: var(--accent-hover);
            padding: 0.2rem 0.7rem;
            border-radius: 100px;
        }

/* ============================================================
   FORMS
   Upload form fields and actions.
   ============================================================ */

        .form-group {
            margin-bottom: 0.75rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.2rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--surface);
            transition: var(--transition);
            color: var(--text);
            -webkit-appearance: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: transparent;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .form-actions .btn {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: var(--radius-xs);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            -webkit-tap-highlight-color: transparent;
        }

        .form-actions .btn:active {
            transform: scale(0.96);
        }

        .form-actions .btn-primary {
            background: var(--accent);
            color: white;
        }

        .form-actions .btn-secondary {
            background: var(--bg);
            color: var(--text-secondary);
        }

        .form-actions .btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .form-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

/* ============================================================
   TOAST & SKELETON
   ============================================================ */

        .toast-container {
            position: fixed;
            bottom: calc(var(--nav-height) + 20px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            max-width: 400px;
            width: 90%;
            pointer-events: none;
        }

        .toast {
            background: var(--text);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            pointer-events: auto;
            margin-bottom: 0.5rem;
        }

        .toast svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .toast.success { background: #16a34a; }

        .toast.error { background: #dc2626; }

        .toast.info { background: var(--accent); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .skeleton {
            background: linear-gradient(90deg, var(--bg) 25%, #e8eaed 50%, var(--bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-xs);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            background: var(--surface-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .skeleton-card .skeleton-thumb {
            aspect-ratio: 16 / 9;
            width: 100%;
            background: var(--bg);
        }

        .skeleton-card .skeleton-body {
            padding: 0.75rem 1rem 1rem;
        }

        .skeleton-card .skeleton-body .skeleton-line {
            height: 12px;
            border-radius: 4px;
            margin-bottom: 0.4rem;
        }

        .skeleton-card .skeleton-body .skeleton-line.w60 { width: 60%; }

        .skeleton-card .skeleton-body .skeleton-line.w40 { width: 40%; }

        .skeleton-card .skeleton-body .skeleton-line.w80 { width: 80%; }

        .skeleton-card .skeleton-body .skeleton-line.w30 { width: 30%; }

/* ============================================================
   RESPONSIVE / DESKTOP
   min-width overrides layered on top of the mobile-first rules above.
   ============================================================ */

        @media (min-width: 640px) {
            .rail { margin: 0 -1.5rem; padding-left: 1.5rem; padding-right: 1.5rem; }
        }

        @media (min-width: 1024px) {
            .rail { margin: 0 -2rem; padding-left: 2rem; padding-right: 2rem; }
            .trend-card { width: 260px; }
        }

        @media (min-width: 640px) {
            .main {
                padding: 1rem 1.5rem;
                max-width: 720px;
            }

            .asset-card .body {
                padding: 1rem 1.25rem 1.25rem;
            }

            .asset-title {
                font-size: 1.1rem;
            }
        }

        @media (min-width: 1024px) {
            .main {
                max-width: 960px;
                padding: 1.5rem 2rem;
            }

            .asset-card {
                margin-bottom: 1.25rem;
            }

            .asset-title {

            }

            .bottom-nav {

            }

            .fab {

            }

            .app {
                padding-bottom: 0;
            }

            .sidebar-desktop {
                display: flex !important;
            }

            }
        }

        @media (min-width: 1024px) {
            .app {
                padding-left: 220px;
            }
        }

        /* Real pointer devices only — avoids sticky :hover states on touch */
        @media (hover: hover) and (pointer: fine) {
            .asset-card:hover {
                transform: translateY(-3px);
                box-shadow: var(--shadow-md);

            }

            .filter-chips .chip:hover:not(.active) {
                border-color: var(--accent);
                color: var(--accent);
            }
        }
    </style>
</head>

            function getYoutubeId(url) {
                if (!url) return null;
                const m = url.match(/[?&]v=([^&]+)/) || url.match(/youtu\.be\/([^?&]+)/) || url.match(/youtube\.com\/embed\/([^?&]+)/);
                return m ? m[1] : null;
            }

            function embedYoutube(id) { return `https://www.youtube.com/embed/${id}?rel=0`; }

            function formatNumber(n) {
                if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
                return n.toString();
            }

            function formatDate(ts) {
                if (!ts) return '-';
                const d = new Date(ts);
                const now = new Date();
                const diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));
                if (diff === 0) return 'Hari ini';
                if (diff === 1) return 'Kemarin';
                if (diff < 7) return `${diff} hari lalu`;
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            function escapeHtml(text) {
                if (!text) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            function getInitials(name) {
                if (!name) return '?';
                return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
            }

                const container = document.getElementById('toastContainer');

                let icon = '';
                if (type === 'success') {

                } else {
                    icon = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;

                toast.innerHTML = `${icon} ${message}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)';
                    toast.style.transition = '0.3s';

            }

                localStorage.setItem('presethub_follows', JSON.stringify(list));
            }

                const stored = localStorage.getItem('presethub_assets');

                    try {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            assets = parsed;
                            assets.forEach(item => {
                                if (!item.createdAt) item.createdAt = Date.now();
                                if (!item.updatedAt) item.updatedAt = Date.now();
                                if (item.likes === undefined) item.likes = 0;
                                if (item.saves === undefined) item.saves = 0;
                                if (item.downloads === undefined) item.downloads = 0;
                                if (item.views === undefined) item.views = 0;
                                if (!item.tag) item.tag = [];
                                if (!item.screenshots) item.screenshots = [];
                                if (!item.id) item.id = randomId();
                            });
                            return;
                        }
                    } catch (e) {}
                }

                assets = [
                    {
                        id: 'a1',
                        judul: 'Cinematic Transition Pack',

                        kategori: 'Transition',
                        tag: ['Transition', 'Velocity', 'AE'],

                        saves: 89,
                        downloads: 1240,
                        views: 4300,
                        createdAt: Date.now() - 100000,
                        updatedAt: Date.now() - 50000,
                        favorite: true
                    },
                    {
                        id: 'a2',
                        judul: 'Color Grade LUT Pack',
                        pembuat: 'Visual Lab',
                        kategori: 'Color Grade',
                        tag: ['LUT', 'Color', 'DaVinci'],
                        software: 'DaVinci Resolve',
                        deskripsi: '20 cinematic LUT untuk color grading profesional. Cocok untuk film dan video musik.',
                        thumbnail: 'https://placehold.co/600x338/1e293b/white?text=LUT+Pack',
                        linkDownload: 'https://drive.google.com/',
                        linkYoutube: '',
                        license: 'free',
                        likes: 156,
                        saves: 67,
                        downloads: 3400,
                        views: 8900,
                        createdAt: Date.now() - 200000,
                        updatedAt: Date.now() - 100000,
                        favorite: false
                    },
                    {
                        id: 'a3',
                        judul: 'Velocity Text Presets',
                        pembuat: 'Motion Pro',
                        kategori: 'Text Effect',
                        tag: ['Velocity', 'Text', 'CapCut'],
                        software: 'CapCut',
                        deskripsi: '30 text animation preset untuk CapCut. Mudah digunakan, tinggal drag and drop.',

                        updatedAt: Date.now() - 150000,
