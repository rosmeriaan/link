<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#0f172a" />
    <title>PresetHub · Komunitas Kreator</title>
    <style>
        /* ============================================================
           VARIABLES & RESET
           ============================================================ */
        :root {
            --bg: #f1f3f5;
            --surface: #ffffff;
            --surface-card: #ffffff;
            --border: #e5e7eb;
            --border-light: #f1f3f5;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.08);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --nav-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: calc(var(--nav-height) + 16px + var(--safe-bottom));
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            flex-shrink: 0;
        }

        .header-brand svg {
            width: 28px;
            height: 28px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-brand span { color: var(--accent); }

        .header-search {
            flex: 1;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg);
            border-radius: 100px;
            padding: 0.35rem 1rem;
            transition: var(--transition);
        }

        .header-search:focus-within {
            background: var(--surface);
            box-shadow: 0 0 0 2px var(--accent);
        }

        .header-search svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .header-search input {
            border: none;
            background: transparent;
            padding: 0.45rem 0;
            width: 100%;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
            color: var(--text);
        }

        .header-search input::placeholder {
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .header-actions .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--text-secondary);
            position: relative;
        }

        .header-actions .btn-icon:hover,
        .header-actions .btn-icon:active {
            background: var(--bg);
        }

        .header-actions .btn-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-actions .btn-icon .badge-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--surface);
        }

        /* ============================================================
           FILTER CHIPS (horizontal scroll)
           ============================================================ */
        .filter-chips {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 60px;
            z-index: 40;
        }

        .filter-chips::-webkit-scrollbar { display: none; }

        .filter-chips .chip {
            flex-shrink: 0;
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--bg);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .filter-chips .chip:active {
            transform: scale(0.96);
        }

        .filter-chips .chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .filter-chips .chip svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main {
            flex: 1;
            padding: 0.75rem 1rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
           ASSET CARD — Mobile First
           ============================================================ */
        .asset-card {
            background: var(--surface-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 1rem;
            transition: var(--transition);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .asset-card:active {
            transform: scale(0.99);
        }

        .asset-card .thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--bg);
            object-fit: contain;
            display: block;
            background-color: #0f172a;
        }

        .asset-card .thumb-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .asset-card .thumb-placeholder svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 1.5;
        }

        .asset-card .body {
            padding: 0.75rem 1rem 1rem;
        }

        .asset-card .body .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .asset-card .body .title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .asset-card .body .badges {
            display: flex;
            gap: 0.3rem;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .asset-card .body .badges .badge {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 0.1rem 0.5rem;
            border-radius: 100px;
            background: var(--bg);
            color: var(--text-secondary);
        }

        .asset-card .body .badges .badge.free {
            background: #dcfce7;
            color: #15803d;
        }

        .asset-card .body .badges .badge.pro {
            background: #fef3c7;
            color: #b45309;
        }

        .asset-card .body .badges .badge.featured {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .asset-card .body .creator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.4rem 0 0.25rem;
        }

        .asset-card .body .creator .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--accent);
            flex-shrink: 0;
            overflow: hidden;
        }

        .asset-card .body .creator .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .asset-card .body .creator .name {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .asset-card .body .creator .verified {
            display: inline-flex;
            align-items: center;
        }

        .asset-card .body .creator .verified svg {
            width: 14px;
            height: 14px;
            stroke: var(--accent);
            fill: var(--accent);
        }

        .asset-card .body .stats {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .asset-card .body .stats span {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .asset-card .body .stats svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .asset-card .body .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }

        .asset-card .body .tags .tag {
            font-size: 0.65rem;
            padding: 0.05rem 0.6rem;
            border-radius: 100px;
            background: var(--bg);
            color: var(--text-secondary);
        }

        .asset-card .body .actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }

        .asset-card .body .actions .btn-like,
        .asset-card .body .actions .btn-save {
            background: none;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .asset-card .body .actions .btn-like:active,
        .asset-card .body .actions .btn-save:active {
            transform: scale(0.92);
        }

        .asset-card .body .actions .btn-like svg,
        .asset-card .body .actions .btn-save svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .asset-card .body .actions .btn-like.active svg {
            fill: #ef4444;
            stroke: #ef4444;
        }

        .asset-card .body .actions .btn-save.active svg {
            fill: var(--accent);
            stroke: var(--accent);
        }

        .asset-card .body .actions .btn-download {
            margin-left: auto;
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: var(--radius-xs);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .asset-card .body .actions .btn-download:active {
            transform: scale(0.95);
        }

        .asset-card .body .actions .btn-download svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 56px;
            height: 56px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 0.75rem;
        }

        /* ============================================================
           BOTTOM NAVIGATION
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(var(--nav-height) + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .bottom-nav .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.1rem;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 0.6rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            padding: 0.3rem 0.8rem;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            min-height: 44px;
            min-width: 44px;
        }

        .bottom-nav .nav-btn:active {
            transform: scale(0.92);
        }

        .bottom-nav .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bottom-nav .nav-btn.active {
            color: var(--accent);
        }

        .bottom-nav .nav-btn .nav-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .bottom-nav .nav-btn .badge-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--surface);
        }

        /* ============================================================
           FAB (Floating Action Button)
           ============================================================ */
        .fab {
            position: fixed;
            bottom: calc(var(--nav-height) + 20px + var(--safe-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            border: none;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 90;
            -webkit-tap-highlight-color: transparent;
        }

        .fab:active {
            transform: scale(0.92);
        }

        .fab svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           MODAL / BOTTOM SHEET
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            padding: 1.5rem 1rem calc(var(--safe-bottom) + 1rem);
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-sheet {
            background: var(--surface);
            border-radius: var(--radius) var(--radius) 0 0;
            max-width: 600px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 1.5rem 1.25rem 2rem;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            border-bottom: none;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-sheet .handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 0 auto 1.25rem;
            flex-shrink: 0;
        }

        .modal-sheet .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-sheet .modal-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-sheet .modal-close {
            background: none;
            border: none;
            padding: 0.25rem;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .modal-sheet .modal-close:active {
            transform: scale(0.92);
        }

        .modal-sheet .modal-close svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           FORM (di dalam modal)
           ============================================================ */
        .form-group {
            margin-bottom: 0.75rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.2rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--surface);
            transition: var(--transition);
            color: var(--text);
            -webkit-appearance: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: transparent;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .form-actions .btn {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: var(--radius-xs);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            -webkit-tap-highlight-color: transparent;
        }

        .form-actions .btn:active {
            transform: scale(0.96);
        }

        .form-actions .btn-primary {
            background: var(--accent);
            color: white;
        }

        .form-actions .btn-secondary {
            background: var(--bg);
            color: var(--text-secondary);
        }

        .form-actions .btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .form-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        /* ============================================================
           DETAIL ASSET (di dalam modal)
           ============================================================ */
        .detail-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f172a;
            border-radius: var(--radius-sm);
            object-fit: contain;
            margin-bottom: 0.75rem;
        }

        .detail-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.1rem;
        }

        .detail-creator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.3rem 0 0.5rem;
        }

        .detail-creator .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent);
            flex-shrink: 0;
            overflow: hidden;
        }

        .detail-creator .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-creator .name {
            font-weight: 500;
        }

        .detail-creator .verified svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent);
            fill: var(--accent);
        }

        .detail-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin: 0.5rem 0;
        }

        .detail-stats span {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .detail-stats svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .detail-desc {
            margin: 0.5rem 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin: 0.5rem 0;
        }

        .detail-tags .tag {
            background: var(--bg);
            padding: 0.1rem 0.7rem;
            border-radius: 100px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .detail-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }

        .detail-links a {
            font-size: 0.8rem;
            padding: 0.2rem 0.8rem;
            border-radius: 100px;
            background: var(--bg);
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .detail-links a:active {
            transform: scale(0.96);
        }

        .detail-links a:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .detail-download-btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: var(--radius-xs);
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.75rem 0 0.5rem;
            -webkit-tap-highlight-color: transparent;
        }

        .detail-download-btn:active {
            transform: scale(0.97);
        }

        .detail-download-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: calc(var(--nav-height) + 20px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            max-width: 400px;
            width: 90%;
            pointer-events: none;
        }

        .toast {
            background: var(--text);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            pointer-events: auto;
            margin-bottom: 0.5rem;
        }

        .toast svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        .toast.info { background: var(--accent); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ============================================================
           SKELETON LOADING
           ============================================================ */
        .skeleton {
            background: linear-gradient(90deg, var(--bg) 25%, #e8eaed 50%, var(--bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-xs);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            background: var(--surface-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .skeleton-card .skeleton-thumb {
            aspect-ratio: 16 / 9;
            width: 100%;
            background: var(--bg);
        }

        .skeleton-card .skeleton-body {
            padding: 0.75rem 1rem 1rem;
        }

        .skeleton-card .skeleton-body .skeleton-line {
            height: 12px;
            border-radius: 4px;
            margin-bottom: 0.4rem;
        }

        .skeleton-card .skeleton-body .skeleton-line.w60 { width: 60%; }
        .skeleton-card .skeleton-body .skeleton-line.w40 { width: 40%; }
        .skeleton-card .skeleton-body .skeleton-line.w80 { width: 80%; }
        .skeleton-card .skeleton-body .skeleton-line.w30 { width: 30%; }

        /* ============================================================
           RESPONSIVE: Tablet & Desktop
           ============================================================ */
        @media (min-width: 640px) {
            .main {
                padding: 1rem 1.5rem;
                max-width: 720px;
            }

            .asset-card .body {
                padding: 1rem 1.25rem 1.25rem;
            }

            .asset-card .body .title {
                font-size: 1.1rem;
            }
        }

        @media (min-width: 1024px) {
            .main {
                max-width: 960px;
                padding: 1.5rem 2rem;
            }

            .asset-card {
                margin-bottom: 1.25rem;
            }

            .asset-card .body .title {
                font-size: 1.15rem;
            }

            /* Desktop: sidebar muncul, bottom nav hilang */
            .bottom-nav {
                display: none;
            }

            .fab {
                display: none;
            }

            .app {
                padding-bottom: 0;
            }

            /* Tampilkan sidebar di desktop */
            .sidebar-desktop {
                display: flex !important;
            }

            .header {
                padding: 0.75rem 2rem;
            }
        }

        /* ============================================================
           DESKTOP SIDEBAR (hidden by default)
           ============================================================ */
        .sidebar-desktop {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 220px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            flex-direction: column;
            z-index: 10;
            overflow-y: auto;
        }

        .sidebar-desktop .brand {
            font-size: 1.1rem;
            font-weight: 700;

                padding-left: 220px;
            }
        }
    </style>
</head>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // STATE
            // ============================================================
            let assets = [];
            let editIndex = null;
            let currentFilter = 'all';
            let currentChip = 'all';
            let currentView = 'all';

            // DOM refs
            const cardGrid = document.getElementById('cardGrid');
            const searchInput = document.getElementById('searchInput');
            const filterChips = document.getElementById('filterChips');

            // Form
            const fJudul = document.getElementById('fJudul');
            const fPembuat = document.getElementById('fPembuat');
            const fKategori = document.getElementById('fKategori');
            const fTag = document.getElementById('fTag');
            const fSoftware = document.getElementById('fSoftware');
            const fDeskripsi = document.getElementById('fDeskripsi');
            const fThumbnail = document.getElementById('fThumbnail');
            const fLinkDownload = document.getElementById('fLinkDownload');
            const fLinkYoutube = document.getElementById('fLinkYoutube');
            const fLicense = document.getElementById('fLicense');
            const submitBtn = document.getElementById('submitBtn');
            const modalTitle = document.getElementById('modalTitle');

            // Modals
            const uploadModal = document.getElementById('uploadModal');
            const detailModal = document.getElementById('detailModal');
            const closeUpload = document.getElementById('closeUploadModal');
            const fabUpload = document.getElementById('fabUpload');
            const totalDesktop = document.getElementById('totalDesktop');

            // ============================================================
            // HELPERS
            // ============================================================
            function getYoutubeId(url) {
                if (!url) return null;
                const m = url.match(/[?&]v=([^&]+)/) || url.match(/youtu\.be\/([^?&]+)/) || url.match(/youtube\.com\/embed\/([^?&]+)/);
                return m ? m[1] : null;
            }

            function embedYoutube(id) { return `https://www.youtube.com/embed/${id}?rel=0`; }

            function formatNumber(n) {
                if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
                return n.toString();
            }

            function formatDate(ts) {
                if (!ts) return '-';
                const d = new Date(ts);
                const now = new Date();
                const diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));
                if (diff === 0) return 'Hari ini';
                if (diff === 1) return 'Kemarin';
                if (diff < 7) return `${diff} hari lalu`;
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            function escapeHtml(text) {
                if (!text) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            function getInitials(name) {
                if (!name) return '?';
                return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
            }

            function randomId() { return Math.random().toString(36).substring(2, 9); }

            // ============================================================
            // TOAST
            // ============================================================
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;

                let icon = '';
                if (type === 'success') {
                    icon = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
                } else if (type === 'error') {
                    icon = `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
                } else {
                    icon = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
                }

                toast.innerHTML = `${icon} ${message}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)';
                    toast.style.transition = '0.3s';
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }

            // ============================================================
            // STORAGE
            // ============================================================
            function save() {
                localStorage.setItem('presethub_assets', JSON.stringify(assets));
            }

            function load() {
                const stored = localStorage.getItem('presethub_assets');
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            assets = parsed;
                            assets.forEach(item => {
                                if (!item.createdAt) item.createdAt = Date.now();
                                if (!item.updatedAt) item.updatedAt = Date.now();
                                if (item.likes === undefined) item.likes = 0;
                                if (item.saves === undefined) item.saves = 0;
                                if (item.downloads === undefined) item.downloads = 0;
                                if (item.views === undefined) item.views = 0;
                                if (!item.tag) item.tag = [];
                                if (!item.id) item.id = randomId();
                            });
                            return;
                        }
                    } catch (e) {}
                }

                // Sample data
                assets = [
                    {
                        id: 'a1',
                        judul: 'Cinematic Transition Pack',
                        pembuat: 'Numan Creative',
                        kategori: 'Transition',
                        tag: ['Transition', 'Velocity', 'AE'],
                        software: 'After Effects',
                        deskripsi: '50 cinematic transitions untuk video editor profesional. Cocok untuk film pendek, trailer, dan konten branding.',
                        thumbnail: 'https://placehold.co/600x338/0f172a/white?text=Cinematic+Transitions',
                        linkDownload: 'https://drive.google.com/',
                        linkYoutube: 'https://youtu.be/dQw4w9WgXcQ',
                        license: 'pro',
                        likes: 234,
                        saves: 89,
                        downloads: 1240,
                        views: 4300,
                        createdAt: Date.now() - 100000,
                        updatedAt: Date.now() - 50000,
                        favorite: true
                    },
                    {
                        id: 'a2',
                        judul: 'Color Grade LUT Pack',
                        pembuat: 'Visual Lab',
                        kategori: 'Color Grade',
                        tag: ['LUT', 'Color', 'DaVinci'],
                        software: 'DaVinci Resolve',
                        deskripsi: '20 cinematic LUT untuk color grading profesional. Cocok untuk film dan video musik.',
                        thumbnail: 'https://placehold.co/600x338/1e293b/white?text=LUT+Pack',
                        linkDownload: 'https://drive.google.com/',
                        linkYoutube: '',
                        license: 'free',
                        likes: 156,
                        saves: 67,
                        downloads: 3400,
                        views: 8900,
                        createdAt: Date.now() - 200000,
                        updatedAt: Date.now() - 100000,
                        favorite: false
                    },
                    {
                        id: 'a3',
                        judul: 'Velocity Text Presets',
                        pembuat: 'Motion Pro',
                        kategori: 'Text Effect',
                        tag: ['Velocity', 'Text', 'CapCut'],
                        software: 'CapCut',
                        deskripsi: '30 text animation preset untuk CapCut. Mudah digunakan, tinggal drag and drop.',
                        thumbnail: 'https://placehold.co/600x338/0f172a/white?text=Text+Presets',
                        linkDownload: 'https://drive.google.com/',
                        linkYoutube: 'https://youtu.be/dQw4w9WgXcQ',
                        license: 'free',
                        likes: 89,
                        saves: 34,
                        downloads: 5600,
                        views: 12000,
                        createdAt: Date.now() - 300000,
                        updatedAt: Date.now() - 150000,
                        favorite: false
                    }
                ];
                save();
            }

            // ============================================================
            // RENDER
            // ============================================================
            function getFiltered() {
                let result = [...assets];

                const q = searchInput.value.toLowerCase().trim();
                if (q) {
                    result = result.filter(item =>
                        item.judul.toLowerCase().includes(q) ||
                        (item.pembuat && item.pembuat.toLowerCase().includes(q)) ||
                        (item.kategori && item.kategori.toLowerCase().includes(q)) ||
                        (item.tag && item.tag.some(t => t.toLowerCase().includes(q))) ||
                        (item.software && item.software.toLowerCase().includes(q))
                    );
                }

                // View filter (sidebar)
                if (currentView === 'trending') {
                    result.sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
                } else if (currentView === 'favorites') {
                    result = result.filter(item => item.favorite);
                } else if (currentView === 'free') {
                    result = result.filter(item => item.license === 'free');
                } else if (currentView === 'pro') {
                    result = result.filter(item => item.license === 'pro');
                }

                // Chip filter
                if (currentChip !== 'all') {
                    result = result.filter(item => {
                        if (currentChip === 'after-effects') return item.software === 'After Effects';
                        if (currentChip === 'premiere') return item.software === 'Premiere Pro';
                        if (currentChip === 'capcut') return item.software === 'CapCut';
                        if (currentChip === 'alight') return item.software === 'Alight Motion';
                        if (currentChip === 'vn') return item.software === 'VN Video Editor';
                        if (currentChip === 'free') return item.license === 'free';
                        if (currentChip === 'pro') return item.license === 'pro';
                        if (currentChip === 'velocity') return item.tag && item.tag.some(t => t.toLowerCase() === 'velocity');
                        if (currentChip === 'transition') return item.kategori === 'Transition';
                        return true;
                    });
                }

                return result;
            }

            function render() {
                const filtered = getFiltered();
                const total = assets.length;
                totalDesktop.textContent = total;

                if (filtered.length === 0) {
                    cardGrid.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                            <p>Tidak ada preset ditemukan</p>
                            <p style="font-size:0.85rem;color:var(--text-muted);">Coba ubah filter atau upload preset baru</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                filtered.forEach((item) => {
                    const idx = assets.indexOf(item);
                    const youtubeId = item.linkYoutube ? getYoutubeId(item.linkYoutube) : null;
                    const embedUrl = youtubeId ? embedYoutube(youtubeId) : null;
                    const thumb = item.thumbnail || '';

                    const tags = (item.tag || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

                    const isFree = item.license === 'free';
                    const isPro = item.license === 'pro';
                    const badgeClass = isFree ? 'free' : 'pro';
                    const badgeText = isFree ? 'Gratis' : 'Pro';

                    html += `
                        <div class="asset-card" data-id="${item.id}">
                            ${thumb ? `<img class="thumb" src="${escapeHtml(thumb)}" alt="${escapeHtml(item.judul)}" loading="lazy" onerror="this.style.display='none'">` :
                                `<div class="thumb-placeholder"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="8" y1="2" x2="8" y2="22"/><line x1="16" y1="2" x2="16" y2="22"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="2" y1="16" x2="22" y2="16"/></svg></div>`
                            }
                            <div class="body">
                                <div class="top">
                                    <div class="title">${escapeHtml(item.judul)}</div>
                                    <div class="badges">
                                        ${isFree || isPro ? `<span class="badge ${badgeClass}">${badgeText}</span>` : ''}
                                    </div>
                                </div>
                                <div class="creator">
                                    <div class="avatar">${getInitials(item.pembuat)}</div>
                                    <span class="name">${escapeHtml(item.pembuat || 'Anonim')}</span>
                                    <span class="verified">
                                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    </span>
                                </div>
                                <div class="stats">
                                    <span>
                                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                        ${formatNumber(item.downloads || 0)}
                                    </span>
                                    <span>
                                        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        ${formatNumber(item.views || 0)}
                                    </span>
                                    <span>
                                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                        ${formatNumber(item.likes || 0)}
                                    </span>
                                    ${item.software ? `<span>${escapeHtml(item.software)}</span>` : ''}
                                </div>
                                ${tags ? `<div class="tags">${tags}</div>` : ''}
                                ${item.deskripsi ? `<div class="desc" style="font-size:0.8rem;color:var(--text-secondary);margin:0.3rem 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${escapeHtml(item.deskripsi)}</div>` : ''}
                                ${embedUrl ? `<div style="border-radius:var(--radius-xs);overflow:hidden;aspect-ratio:16/9;background:#000;margin:0.4rem 0;"><iframe src="${embedUrl}" style="width:100%;height:100%;border:none;" allowfullscreen loading="lazy"></iframe></div>` : ''}
                                <div class="actions">
                                    <button class="btn-like ${item.favorite ? 'active' : ''}" data-like="${idx}">
                                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                        ${item.likes || 0}
                                    </button>
                                    <button class="btn-save" data-save="${idx}">
                                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                        Simpan
                                    </button>
                                    <button class="btn-download" data-download="${idx}">
                                        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                        Download
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                cardGrid.innerHTML = html;

                // Event listeners
                cardGrid.querySelectorAll('[data-like]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.like);
                        if (!isNaN(idx) && assets[idx]) {
                            assets[idx].likes = (assets[idx].likes || 0) + 1;
                            assets[idx].favorite = !assets[idx].favorite;
                            assets[idx].updatedAt = Date.now();
                            save();
                            render();
                            showToast(assets[idx].favorite ? '❤️ Ditambahkan ke favorit' : '💔 Dihapus dari favorit', 'info');
                        }
                    });
                });

                cardGrid.querySelectorAll('[data-save]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.save);
                        if (!isNaN(idx) && assets[idx]) {
                            assets[idx].saves = (assets[idx].saves || 0) + 1;
                            assets[idx].updatedAt = Date.now();
                            save();
                            render();
                            showToast('📌 Disimpan ke koleksi', 'success');
                        }
                    });
                });

                cardGrid.querySelectorAll('[data-download]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.download);
                        if (!isNaN(idx) && assets[idx]) {
                            assets[idx].downloads = (assets[idx].downloads || 0) + 1;
                            assets[idx].updatedAt = Date.now();
                            save();
                            render();
                            if (assets[idx].linkDownload) {
                                window.open(assets[idx].linkDownload, '_blank');
                                showToast('⬇️ Memulai download...', 'success');
                            } else {
                                showToast('Link download tidak tersedia', 'error');
                            }
                        }
                    });
                });

                // Klik card untuk detail
                cardGrid.querySelectorAll('.asset-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const idx = assets.findIndex(a => a.id === id);
                        if (idx !== -1) {
                            assets[idx].views = (assets[idx].views || 0) + 1;
                            save();
                            openDetail(idx);
                        }
                    });
                });
            }

            // ============================================================
            // DETAIL
            // ============================================================
            function openDetail(index) {
                const item = assets[index];
                if (!item) return;

                const youtubeId = item.linkYoutube ? getYoutubeId(item.linkYoutube) : null;
                const embedUrl = youtubeId ? embedYoutube(youtubeId) : null;
                const thumb = item.thumbnail || '';

                const tags = (item.tag || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
                const isFree = item.license === 'free';
                const isPro = item.license === 'pro';
                const badgeClass = isFree ? 'free' : 'pro';
                const badgeText = isFree ? 'Gratis' : 'Pro';

                const detailContent = document.getElementById('detailContent');
                detailContent.innerHTML = `
                    <div class="modal-header">
                        <h2>${escapeHtml(item.judul)}</h2>
                        <button class="modal-close" id="closeDetailModal">
                            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    ${thumb ? `<img class="detail-thumb" src="${escapeHtml(thumb)}" alt="${escapeHtml(item.judul)}" onerror="this.style.display='none'">` : ''}
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.3rem;">
                        ${isFree || isPro ? `<span class="badge ${badgeClass}" style="font-size:0.7rem;font-weight:700;padding:0.1rem 0.6rem;border-radius:100px;">${badgeText}</span>` : ''}
                        ${item.software ? `<span style="font-size:0.75rem;background:var(--bg);padding:0.1rem 0.6rem;border-radius:100px;">${escapeHtml(item.software)}</span>` : ''}
                    </div>
                    <div class="detail-creator">
                        <div class="avatar">${getInitials(item.pembuat)}</div>
                        <span class="name">${escapeHtml(item.pembuat || 'Anonim')}</span>
                        <span class="verified">
                            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        </span>
                    </div>
                    <div class="detail-stats">
                        <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatNumber(item.downloads || 0)} download</span>
                        <span><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> ${formatNumber(item.views || 0)} views</span>
                        <span><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${item.likes || 0}</span>
                    </div>
                    ${item.deskripsi ? `<div class="detail-desc">${escapeHtml(item.deskripsi)}</div>` : ''}
                    ${tags ? `<div class="detail-tags">${tags}</div>` : ''}
                    ${embedUrl ? `<div style="border-radius:var(--radius-xs);overflow:hidden;aspect-ratio:16/9;background:#000;margin:0.5rem 0;"><iframe src="${embedUrl}" style="width:100%;height:100%;border:none;" allowfullscreen></iframe></div>` : ''}
                    <button class="detail-download-btn" id="detailDownloadBtn">
                        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download Preset
                    </button>
                    <div style="font-size:0.7rem;color:var(--text-muted);text-align:center;margin-top:0.3rem;">
                        Diupload ${formatDate(item.createdAt)} · Diupdate ${formatDate(item.updatedAt)}
                    </div>
                `;

                detailModal.classList.add('active');

                document.getElementById('closeDetailModal').addEventListener('click', function() {
                    detailModal.classList.remove('active');
                });

                document.getElementById('detailDownloadBtn').addEventListener('click', function() {
                    if (item.linkDownload) {
                        assets[index].downloads = (assets[index].downloads || 0) + 1;
                        save();
                        window.open(item.linkDownload, '_blank');
                        showToast('⬇️ Memulai download...', 'success');
                    } else {
                        showToast('Link download tidak tersedia', 'error');
                    }
                });

                detailModal.addEventListener('click', function(e) {
                    if (e.target === this) detailModal.classList.remove('active');
                });
            }

            // ============================================================
            // FORM UPLOAD
            // ============================================================
            function getFormData() {
                return {
                    id: randomId(),
                    judul: fJudul.value.trim(),
                    pembuat: fPembuat.value.trim() || 'Anonim',
                    kategori: fKategori.value,
                    tag: fTag.value.split(',').map(s => s.trim()).filter(Boolean),
                    software: fSoftware.value,
                    deskripsi: fDeskripsi.value.trim(),
                    thumbnail: fThumbnail.value.trim(),
                    linkDownload: fLinkDownload.value.trim(),
                    linkYoutube: fLinkYoutube.value.trim(),
                    license: fLicense.value,
                    likes: 0,
                    saves: 0,
                    downloads: 0,
                    views: 0,
                    favorite: false,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
            }

            function resetForm() {
                fJudul.value = '';
                fPembuat.value = '';
                fKategori.value = '';
                fTag.value = '';
                fSoftware.value = '';
                fDeskripsi.value = '';
                fThumbnail.value = '';
                fLinkDownload.value = '';
                fLinkYoutube.value = '';
                fLicense.value = 'free';
                submitBtn.textContent = 'Publikasikan';
                modalTitle.textContent = 'Upload Preset';
                editIndex = null;
            }

            function handleSubmit(e) {
                e.preventDefault();
                const data = getFormData();

                if (!data.judul) {
                    showToast('Nama preset wajib diisi', 'error');
                    fJudul.focus();
                    return;
                }
                if (!data.linkDownload) {
                    showToast('Link download wajib diisi', 'error');
                    fLinkDownload.focus();
                    return;
                }
                if (data.linkYoutube) {
                    const id = getYoutubeId(data.linkYoutube);
                    if (!id) {
                        showToast('Format YouTube tidak valid', 'error');
                        fLinkYoutube.focus();
                        return;
                    }
                }

                if (editIndex !== null) {
                    data.createdAt = assets[editIndex].createdAt;
                    data.likes = assets[editIndex].likes || 0;
                    data.saves = assets[editIndex].saves || 0;
                    data.downloads = assets[editIndex].downloads || 0;
                    data.views = assets[editIndex].views || 0;
                    data.favorite = assets[editIndex].favorite || false;
                    data.id = assets[editIndex].id || randomId();
                    assets[editIndex] = data;
                    showToast('✅ Preset berhasil diupdate', 'success');
                } else {
                    assets.push(data);
                    showToast('✅ Preset berhasil dipublikasikan!', 'success');
                }

                save();
                resetForm();
                render();
                uploadModal.classList.remove('active');
            }

            // ============================================================
            // NAVIGATION
            // ============================================================
            function setView(view) {
                currentView = view;
                document.querySelectorAll('.sidebar-desktop nav button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === view);
                });
                render();
            }

            function setChip(filter) {
                currentChip = filter;
                document.querySelectorAll('.filter-chips .chip').forEach(c => {
                    c.classList.toggle('active', c.dataset.filter === filter);
                });
                render();
            }

            function setNav(nav) {
                document.querySelectorAll('.bottom-nav .nav-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.nav === nav);
                });
                if (nav === 'home') {
                    currentView = 'all';
                    document.querySelectorAll('.sidebar-desktop nav button').forEach(b => {
                        b.classList.toggle('active', b.dataset.view === 'all');
                    });
                    render();
                } else if (nav === 'search') {
                    searchInput.focus();
                } else if (nav === 'saved') {
                    currentView = 'favorites';
                    document.querySelectorAll('.sidebar-desktop nav button').forEach(b => {
                        b.classList.toggle('active', b.dataset.view === 'favorites');
                    });
                    render();
                } else if (nav === 'profile') {
                    showToast('👤 Profil kreator (coming soon)', 'info');
                }
            }

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                load();

                // Sidebar nav (desktop)
                document.querySelectorAll('.sidebar-desktop nav button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        setView(this.dataset.view);
                    });
                });

                // Filter chips
                document.querySelectorAll('.filter-chips .chip').forEach(chip => {
                    chip.addEventListener('click', function() {
                        setChip(this.dataset.filter);
                    });
                });

                // Bottom nav
                document.querySelectorAll('.bottom-nav .nav-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        setNav(this.dataset.nav);
                    });
                });

                // Upload modal
                fabUpload.addEventListener('click', function() {
                    resetForm();
                    uploadModal.classList.add('active');
                });

                document.querySelectorAll('.header-actions .btn-icon').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (this.id === 'notifBtn') {
                            showToast('🔔 Belum ada notifikasi', 'info');
                        } else if (this.id === 'profileBtn') {
                            showToast('👤 Profil kreator (coming soon)', 'info');
                        }
                    });
                });

                closeUpload.addEventListener('click', function() {
                    uploadModal.classList.remove('active');
                });

                uploadModal.addEventListener('click', function(e) {
                    if (e.target === this) uploadModal.classList.remove('active');
                });

                // Search
                searchInput.addEventListener('input', render);

                // Form submit
                document.getElementById('uploadForm').addEventListener('submit', handleSubmit);

                // Reset
                document.getElementById('resetBtn').addEventListener('click', function(e) {
                    e.preventDefault();
                    resetForm();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        if (uploadModal.classList.contains('active')) uploadModal.classList.remove('active');
                        if (detailModal.classList.contains('active')) detailModal.classList.remove('active');
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        searchInput.focus();
                    }
                });

                render();
                showToast('🎬 PresetHub siap digunakan', 'info');
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>

</body>
</html>
